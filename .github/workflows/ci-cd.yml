name: CampusSphere CI/CD Quality & Build Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  # ============================================================================
  # 1. Frontend Build & Static Analysis
  # ============================================================================
  frontend-build:
    name: Frontend Build & Type Validation (React 19 + TypeScript)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./client

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci

      - name: TypeScript Type Check
        run: npx tsc --noEmit

      - name: Production Vite Bundle Build
        run: npm run build

      - name: Verify Dist Artifact Generation
        run: |
          test -d dist || { echo "dist directory missing"; exit 1; }
          test -f dist/index.html || { echo "index.html missing"; exit 1; }

  # ============================================================================
  # 2. Backend Compilation & Test Verification
  # ============================================================================
  backend-build:
    name: Backend Compilation & Spring Boot Validation (Java 21)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./server

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Java 21 (Eclipse Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Make Maven Wrapper Executable
        run: chmod +x ./mvnw

      - name: Compile & Verify Spring Boot Microservice
        run: ./mvnw clean compile test-compile -B -DskipTests=false

  # ============================================================================
  # 3. Docker Container Build Verification
  # ============================================================================
  docker-validation:
    name: Multi-Container Docker Build Verification
    runs-on: ubuntu-latest
    needs: [frontend-build, backend-build]

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: actions/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./server
          file: ./server/Dockerfile
          push: false
          tags: campussphere-server:test

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./client
          file: ./client/Dockerfile
          push: false
          tags: campussphere-client:test
